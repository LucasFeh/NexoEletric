[package]
name = "nexoeletric"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NexoEletric nativo: esquema e PCB no DNA do Altium, desenhado na GPU (wgpu)"

[[bin]]
name = "NexoEletric"
path = "src/main.rs"

[dependencies]
nexo-core = { path = "../nexo-core" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui-wgpu = "0.37"
egui = "0.37"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
