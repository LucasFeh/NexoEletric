<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AltiumPCBMirror — Esquema</title>
<style>
  :root{ --bg:#1b1b1b; --panel:#242424; --panel2:#2d2d2d; --border:#3a3a3a;
    --fg:#d8d8d8; --fg-dim:#9a9a9a; --accent:#4fc3f7; --warn:#ffd54f; --err:#ff5252; --ok:#00e676; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{background:var(--bg); color:var(--fg); font:13px/1.45 "Segoe UI",sans-serif; display:flex; flex-direction:column;}
  #bar{display:flex; align-items:center; gap:8px; height:36px; padding:0 10px;
    background:var(--panel); border-bottom:1px solid var(--border);}
  #bar .meta{color:var(--fg-dim); font-size:12px;}
  #schtoolbar{display:flex; align-items:center; gap:8px; height:32px; padding:0 10px;
    background:var(--panel); border-bottom:1px solid var(--border); font-size:12px;}
  #schtoolbar .sep{width:1px; height:16px; background:var(--border);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button:disabled:hover{border-color:var(--border);}
  button{background:var(--panel2); color:var(--fg); border:1px solid var(--border);
    border-radius:3px; padding:3px 10px; font-size:12px; cursor:pointer;}
  button:hover{border-color:var(--accent);}
  button.active{background:#0d47a1; color:#fff;}
  select{background:var(--panel2); color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:3px;}
  #main{flex:1; display:flex; min-height:0;}
  #cvwrap{flex:1; position:relative;}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair;}
  #side{width:330px; min-width:280px; background:var(--panel); border-left:1px solid var(--border);
    overflow-y:auto;}
  .sec{padding:8px 10px; border-bottom:1px solid var(--border);}
  .sec h2{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-dim); margin-bottom:6px;}
  table{border-collapse:collapse; width:100%; font-size:11px;}
  th,td{padding:2px 5px; text-align:left; border-bottom:1px solid #333; white-space:nowrap;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:#333;}
  tbody tr.sel{background:#0d47a1;}
  .netitem,.valitem{padding:3px 6px; margin:2px 0; border-radius:3px; background:var(--panel2);
    cursor:pointer; font-size:11px; border-left:3px solid transparent;}
  .netitem.sel{background:#0d47a1; color:#fff;}
  .valitem.err{border-left-color:var(--err);}
  .valitem.warn{border-left-color:var(--warn);}
  .annitem{padding:3px 6px; margin:2px 0; border-radius:3px; background:var(--panel2);
    cursor:pointer; font-size:11px; border-left:3px solid transparent;}
  .annitem.err{border-left-color:var(--err);}
  .annitem.warn{border-left-color:var(--warn);}
  .annitem.info{border-left-color:var(--accent);}
  .annitem.resolved{opacity:.5;}
  .annitem .annx{float:right; color:var(--fg-dim); padding:0 4px; cursor:pointer;}
  .annitem .annx:hover{color:var(--err);}
  .pickitem{padding:3px 6px; margin:1px 0; border-radius:3px; background:var(--panel2);
    cursor:pointer; font-size:11px;}
  .pickitem:hover{background:#383838;}
  .pickitem.sel{background:#0d47a1; color:#fff;}
  #schpropsrows label{display:flex; align-items:center; gap:6px; margin:3px 0; font-size:12px; color:var(--fg-dim);}
  #schpropsrows label span{width:80px;}
  #schpropsrows input, #schpropsrows select{flex:1; background:var(--panel); color:var(--fg);
    border:1px solid var(--border); border-radius:3px; padding:3px 5px; font-size:12px; min-width:0;}
  #status{height:24px; display:flex; gap:16px; align-items:center; padding:0 10px;
    background:var(--panel); border-top:1px solid var(--border);
    font:12px Consolas,monospace; color:var(--fg-dim);}
  #status b{color:var(--fg); font-weight:normal;}
  #fatal{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    color:var(--err); font-size:14px; text-align:center; padding:30px; background:var(--bg); z-index:5;}
</style>
</head>
<body>
<div id="bar">
  <b style="color:var(--accent); font-size:13px;">Esquema</b>
  <select id="sheetsel"></select>
  <button id="btnFit">Fit</button>
  <button id="btnGrid" class="active">Grade</button>
  <button id="btnAnn" title="Sinalizar problema para a IA (N)">⚑ Sinalizar</button>
  <button id="btnAnnSave" title="Salvar sinalizadores">Salvar sinaliz.</button>
  <span class="meta" id="meta"></span>
</div>
<div id="schtoolbar">
  <button id="btnEdit" title="Destravar edicao (E)">Editar</button>
  <span class="sep"></span>
  <button id="toolSelect" class="active" title="Selecionar/mover (Esc)">Selecionar</button>
  <button id="toolComp" title="Adicionar componente das libs (C)">+ Componente</button>
  <button id="toolCesta" title="Lista de componentes a colocar (L)">Lista <span id="toolCestaN"></span></button>
  <button id="toolWire" title="Desenhar fio (W); botão direito/Esc encerra">Fio</button>
  <button id="toolLabel" title="Net label">Label</button>
  <button id="toolPower" title="Power port">Power</button>
  <button id="toolJunction" title="Junção">Junção</button>
  <button id="toolText" title="Texto">Texto</button>
  <span class="sep"></span>
  <button id="btnSchSave" title="Salvar schematic.js">Salvar esquema</button>
</div>
<div id="main">
  <div id="cvwrap"><canvas id="cv"></canvas><div id="fatal"></div>
    <div id="annform" style="display:none; position:absolute; top:10px; right:10px; z-index:15;
         background:var(--panel2); border:1px solid var(--border); border-radius:4px; padding:8px; width:240px;">
      <textarea id="anntext" rows="2" placeholder="problema (ex: trilha muito proxima)"
        style="width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--border);
               border-radius:3px; font:12px 'Segoe UI',sans-serif; padding:4px; resize:vertical;"></textarea>
      <div style="display:flex; gap:6px; margin-top:6px; align-items:center;">
        <select id="annsev" style="background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:2px;">
          <option value="err">vermelho (erro)</option>
          <option value="warn">amarelo (atenção)</option>
          <option value="info">azul (nota)</option>
        </select>
        <span style="flex:1"></span>
        <button id="annok">OK</button>
        <button id="anncancel">Cancelar</button>
      </div>
    </div>
    <!-- lista de compras: junta (simbolo, parte, footprint) e joga tudo na folha de uma vez -->
    <div id="cesta" style="display:none; position:absolute; top:10px; right:10px; z-index:16;
         background:var(--panel2); border:1px solid var(--border); border-radius:4px; padding:8px; width:340px;">
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
        <b style="font-size:12px;">lista de componentes</b>
        <span id="cestainfo" style="font-size:11px; color:var(--fg-dim); margin-left:auto;"></span>
      </div>
      <div id="cestalist" style="max-height:300px; overflow-y:auto; margin-bottom:6px;"></div>
      <div style="display:flex; gap:6px; justify-content:flex-end;">
        <button id="cestalimpa">Limpar</button>
        <button id="cestacolocar">Jogar no esquema</button>
        <button id="cestafechar">Fechar</button>
      </div>
    </div>

    <div id="pickform" style="display:none; position:absolute; top:10px; left:10px; z-index:16;
         background:var(--panel2); border:1px solid var(--border); border-radius:4px; padding:8px; width:430px;">
      <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
        <label style="flex:1; font-size:11px; color:var(--fg-dim);">acervo
          <select id="picksrc" style="width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:3px;"></select></label>
        <span id="picksrcinfo" style="font-size:11px; color:var(--fg-dim); white-space:nowrap;"></span>
      </div>
      <input id="picksearch" placeholder="buscar símbolo, valor, MPN ou código Mouser" style="width:100%; background:var(--panel);
             color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:4px; margin-bottom:6px;">
      <div id="picklist" style="max-height:140px; overflow-y:auto; margin-bottom:6px;"></div>
      <canvas id="pickpreview" width="414" height="150" style="width:100%; height:150px; background:#fffef2;
              border:1px solid var(--border); border-radius:3px; margin-bottom:6px;"></canvas>
      <div style="display:flex; gap:6px; margin-bottom:6px;">
        <label style="flex:1; font-size:11px; color:var(--fg-dim);">footprint
          <select id="pickfp" style="width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:3px;"></select></label>
        <label style="width:80px; font-size:11px; color:var(--fg-dim);">ref
          <input id="pickref" style="width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:3px;"></label>
        <label style="width:60px; font-size:11px; color:var(--fg-dim);">parte
          <select id="pickpart" style="width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:3px;"></select></label>
      </div>
      <input id="pickcomment" placeholder="comment (opcional, ex: 10k)" style="width:100%; background:var(--panel);
             color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:4px; margin-bottom:6px;">
      <div style="display:flex; gap:6px; justify-content:flex-end; align-items:center;">
        <label style="font-size:11px; color:var(--fg-dim); margin-right:auto;">qtd
          <input id="pickqtd" type="number" min="1" max="99" value="1" style="width:46px; background:var(--panel);
                 color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:3px;"></label>
        <button id="pickadd" title="junta na lista sem colocar na folha ainda">+ Lista</button>
        <button id="pickok">Posicionar</button>
        <button id="pickcancel">Cancelar</button>
      </div>
    </div>
    <div id="schform" style="display:none; position:absolute; top:10px; right:10px; z-index:16;
         background:var(--panel2); border:1px solid var(--border); border-radius:4px; padding:8px; width:220px;">
      <div id="schformtitle" style="color:var(--accent); font-size:12px; margin-bottom:6px;"></div>
      <input id="schformtext" placeholder="" style="width:100%; background:var(--panel); color:var(--fg);
             border:1px solid var(--border); border-radius:3px; padding:4px; margin-bottom:6px;">
      <select id="schformstyle" style="display:none; width:100%; background:var(--panel); color:var(--fg);
             border:1px solid var(--border); border-radius:3px; padding:3px; margin-bottom:6px;">
        <option>Bar</option><option>Circle</option><option>Arrow</option><option>Wave</option>
        <option>GndPower</option><option>GndSignal</option><option>GndEarth</option>
      </select>
      <div style="display:flex; gap:6px; justify-content:flex-end;">
        <button id="schformok">Posicionar</button>
        <button id="schformcancel">Cancelar</button>
      </div>
    </div>
    <div id="schprops" style="display:none; position:absolute; top:10px; right:10px; z-index:17;
         background:var(--panel2); border:1px solid var(--border); border-radius:4px; padding:8px; width:250px;">
      <div id="schpropstitle" style="color:var(--accent); font-size:12px; margin-bottom:6px;"></div>
      <div id="schpropsrows"></div>
      <div style="display:flex; gap:6px; justify-content:flex-end; margin-top:6px;">
        <button id="schpropsok">OK</button>
        <button id="schpropscancel">Cancelar</button>
      </div>
      <datalist id="fplist-dl"></datalist>
    </div>
  </div>
  <aside id="side">
    <div class="sec"><h2>Componentes</h2>
      <table id="comptable"><thead><tr><th>Ref</th><th>Símbolo</th><th>Footprint</th><th>Comment</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="sec"><h2>Nets (<span id="netcount">0</span>)</h2><div id="netlist"></div></div>
    <div class="sec"><h2>Sinalizadores (<span id="anncount">0</span>)</h2><div id="annlist"></div></div>
    <div class="sec"><h2>Validação</h2><div id="vallist"></div></div>
  </aside>
</div>
<div id="status">
  <span>X: <b id="sx">—</b> Y: <b id="sy">—</b> mil</span>
  <span id="shover"></span>
  <span id="annmsg" style="color:var(--warn);"></span>
</div>
<script src="hub-core.js"></script>
<script src="hub-draw.js"></script>
<script src="Libs/schlib.js"></script>
<script src="Libs/pcblib.js"></script>
<!-- acervos do almoxarifado: o picker escolhe de qual biblioteca vem o simbolo -->
<script src="Libs/almox-basicos.js"></script>
<script src="Libs/almox-especiais.js"></script>
<script src="Libs/almox-index.js"></script>
<!-- tabelas de apelido do resolvedor de nomes; ausentes, o resolvedor so perde os passos
     de rename e de substituicao (o 404 no console e esperado antes da primeira escolha) -->
<script src="Libs/rename-map.js"></script>
<script src="Libs/lib-subs.js"></script>
<script>
  var SCH_P = new URLSearchParams(location.search).get('p') || '_DemoKit';
  document.write('<script src="Projects/' + SCH_P + '/schematic.js"><\/script>');
  document.write('<script src="Projects/' + SCH_P + '/annotations.js"><\/script>');
</script>
<script src="hub-io.js"></script>
<script src="schframe.js"></script>
</body>
</html>
