<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PCB — NexoEletric</title>
<!-- a mesma Inter do hub e da vista Esquema; sem rede, cai no system-ui sem quebrar nada -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<!-- o tema do hub: os tokens (hub-tema.css) e quem escolhe o tema antes da primeira pintura e o
     troca ao vivo quando ele muda nas Configuracoes do hub (hub-tema.js, sincrono) -->
<link rel="stylesheet" href="hub-tema.css">
<script src="hub-tema.js"></script>
<style>
  /* UMA VISTA SO para a web e o desktop (NexoEletric), como a vista Esquema desde 2026-09-25: a
     casca e a do hub, no tema dele. PONTE PARA O TEMA: os nomes desta vista apontam para os
     tokens do hub-tema.css. Cor fixa (hex) aqui so a do DESENHO, que nao segue tema: o canvas
     fica preto com as cores de camada do Altium em qualquer tema (pcbframe.js). */
  :root{
    --panel:var(--surface-2); --panel2:var(--surface); --border:var(--edge);
    --fg:var(--text); --fg-dim:var(--text-2); --fg2:var(--text-2); --accent:var(--hi);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  [hidden]{display:none !important;}
  html,body{height:100%; overflow:hidden;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--scroll); border-radius:8px; border:3px solid var(--panel);}
  ::-webkit-scrollbar-thumb:hover{background:var(--fg-dim);}
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner{background:transparent;}
  @supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin; scrollbar-color:var(--scroll) transparent;} }
  body{background:var(--bg); color:var(--fg); font:13px/1.45 var(--font); display:flex; flex-direction:column;}
  button, input, select, textarea{font-family:inherit;}
  button:focus-visible, input[type=checkbox]:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  #main{flex:1; display:flex; min-height:0; position:relative;}
  #centro{flex:1; display:flex; flex-direction:column; min-width:0;}
  #cvwrap{flex:1; position:relative; min-height:0; background:#000;}
  #v3d{position:absolute; inset:0; z-index:5;}
  canvas#cv{position:absolute; inset:0; width:100%; height:100%; display:block; outline:none; cursor:default;}
  /* a divisoria do painel: a mesma peca do Esquema (arrastar redimensiona, duplo clique fecha/abre) */
  .split{flex:0 0 6px; cursor:col-resize; position:relative; touch-action:none; background:var(--panel); border-left:1px solid var(--border);}
  .split::after{content:''; position:absolute; top:0; bottom:0; left:50%; width:2px; transform:translateX(-50%);
    background:transparent; transition:background .12s;}
  .split:hover::after, .split.on::after{background:var(--accent);}
  #props{width:var(--props-w, 340px); flex:none; min-width:0; min-height:0; overflow:hidden;}

  /* ── a Active Bar: flutua no topo-centro do canvas, como no Altium 21 ── */
  /* centrada por left/right 0 + margin auto (com left:50% e translate a caixa so podia usar a
     metade da largura e a barra quebrava em duas linhas) */
  #pcbtb{position:absolute; top:8px; left:0; right:0; margin:0 auto; width:fit-content; z-index:12; display:flex; flex-wrap:wrap;
    justify-content:center; align-items:center; gap:2px; padding:3px 4px; max-width:calc(100% - 16px);
    background:var(--panel); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow-menu);}
  #pcbtb .sep{width:1px; height:20px; background:var(--border); margin:0 3px;}
  #pcbtb button{display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 6px; border:1px solid transparent;
    background:transparent; color:var(--fg-dim); border-radius:4px; cursor:pointer;}
  #pcbtb button:hover:not(:disabled){color:var(--fg); background:rgba(var(--tint),0.08); border-color:var(--border);}
  #pcbtb button[aria-pressed="true"]{background:var(--hi); border-color:var(--hi); color:var(--on-hi);}
  #pcbtb button:disabled{opacity:.35; cursor:not-allowed;}
  #pcbtb svg{width:18px; height:18px; flex:none;}
  #pcbtb .lb{font-size:11px; letter-spacing:.02em;}
  /* o grupo com gaveta: o botao da ultima ferramenta + a setinha; a gaveta abre embaixo */
  #pcbtb .grupo{position:relative; display:inline-flex; align-items:center;}
  #pcbtb .grupo .gseta{width:14px; padding:0; justify-content:center; margin-left:-2px;}
  #pcbtb .grupo .gseta svg{width:10px; height:10px;}
  #pcbtb .grupo .gseta[aria-expanded="true"]{color:var(--fg); background:rgba(var(--tint),0.08); border-color:var(--border);}
  #pcbtb .gaveta{position:absolute; top:calc(100% + 7px); left:-4px; z-index:13; display:flex; gap:2px; padding:3px 4px;
    background:var(--panel); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow-menu);}
  #pcbtb .gaveta[hidden]{display:none;}

  /* ── as abas de camada, embaixo do canvas: LS + uma aba por camada, com a amostra de cor ── */
  #abas{flex:none; display:flex; align-items:stretch; height:28px; background:var(--panel); border-top:1px solid var(--border); min-width:0;}
  #lsBtn{flex:none; padding:0 11px; font-size:11px; font-weight:600; letter-spacing:.05em; background:transparent; border:0;
    border-right:1px solid var(--border); color:var(--fg-dim); cursor:pointer;}
  #lsBtn:hover{color:var(--fg); background:rgba(var(--tint),0.06);}
  #lsBtn.unica{color:var(--hi); box-shadow:inset 0 -2px 0 var(--hi);}
  #abaslista{flex:1; display:flex; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; min-width:0;}
  #abaslista::-webkit-scrollbar{display:none;}
  .aba{flex:none; display:inline-flex; align-items:center; gap:6px; padding:0 10px; font-size:11.5px; background:transparent;
    border:0; border-right:1px solid var(--border); color:var(--fg-dim); cursor:pointer; white-space:nowrap;}
  .aba .sw{width:11px; height:11px; border-radius:2px; box-shadow:0 0 0 1px var(--line); flex:none;}
  .aba:hover{color:var(--fg); background:rgba(var(--tint),0.06);}
  .aba.on{color:var(--fg); font-weight:600; background:rgba(var(--tint),0.09); box-shadow:inset 0 -2px 0 var(--cor, var(--hi));}
  .aba.vazia{opacity:.55;}
  .aba.oculta span{text-decoration:line-through;}
  .aba.oculta .sw{opacity:.3;}

  /* ── barra de status ── */
  #status{height:24px; flex:none; display:flex; gap:14px; align-items:center; padding:0 10px; background:var(--panel);
    border-top:1px solid var(--border); font:12px var(--mono); color:var(--fg-dim); white-space:nowrap; overflow:hidden;}
  #sxy{color:var(--fg); min-width:210px;}
  #scam{display:inline-flex; align-items:center; gap:5px;}
  #scam b{color:var(--fg); font-weight:normal;}
  #scamsw{display:inline-block; width:10px; height:10px; border-radius:2px; box-shadow:0 0 0 1px var(--line);}
  #srota{color:var(--fg);}
  #ssel{overflow:hidden; text-overflow:ellipsis;}
  #smsg{margin-left:auto; color:var(--warn); overflow:hidden; text-overflow:ellipsis;}

  /* ── o que flutua sobre o canvas ── */
  #txtbox{position:absolute; z-index:14; transform:translate(-8px, -50%); display:flex; flex-direction:column; gap:3px;}
  #txtbox input{width:220px; padding:4px 7px; font:13px var(--font); color:var(--fg); background:var(--panel2);
    border:1px solid var(--accent); border-radius:4px; box-shadow:var(--shadow-menu); outline:none;}
  #txtdica{font-size:10.5px; color:var(--fg-dim); background:var(--panel); padding:1px 6px; border-radius:3px; align-self:flex-start;}
  #annform{position:absolute; top:52px; right:12px; z-index:15; width:270px; background:var(--panel2); border:1px solid var(--border);
    border-radius:6px; padding:8px; box-shadow:var(--shadow-menu);}
  #annform textarea{width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:4px;
    font:12px var(--font); padding:5px; resize:vertical;}
  #annform textarea:focus{outline:none; border-color:var(--accent);}
  #annform .l{display:flex; gap:6px; margin-top:6px; align-items:center;}
  #annform select{background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:2px; font-size:12px;}
  #annform button{background:transparent; color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:3px 10px; font-size:12px; cursor:pointer;}
  #annform button:hover{border-color:var(--accent);}
  #annform button.ok{color:var(--hi); border-color:var(--hi);}
  #annform .t{font-size:11px; color:var(--fg-dim); margin-bottom:5px;}
  #menu{position:fixed; z-index:60; min-width:200px; max-height:72vh; overflow:auto; padding:4px; background:var(--panel);
    border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow-menu);}
  #menu button{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:5px 8px; font-size:12px;
    background:transparent; border:0; border-radius:4px; color:var(--fg); cursor:pointer;}
  #menu button:hover:not(:disabled){background:rgba(var(--tint),0.09);}
  #menu button:disabled{opacity:.4; cursor:not-allowed;}
  #menu kbd{margin-left:auto; font:10.5px var(--mono); color:var(--fg-dim);}
  #menu .sw{width:10px; height:10px; border-radius:2px; flex:none; box-shadow:0 0 0 1px var(--line);}
  #menu .msep{height:1px; background:var(--border); margin:3px 4px;}
  #menu .mtit{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-dim); padding:5px 8px 2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px;}
  #btnPaineis{position:absolute; right:8px; bottom:8px; z-index:12; width:30px; height:30px; padding:0; display:inline-flex;
    align-items:center; justify-content:center; background:var(--panel); border:1px solid var(--border); border-radius:5px;
    color:var(--fg-dim); box-shadow:var(--shadow-menu); cursor:pointer;}
  #btnPaineis:hover{color:var(--fg); border-color:var(--accent);}
  #btnPaineis svg{width:17px; height:17px;}
  #help{position:absolute; inset:24px; z-index:30; overflow:auto; padding:20px 26px; background:var(--panel2);
    border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow-menu); cursor:pointer;}
  #help h2{font-size:15px; color:var(--fg); margin-bottom:8px; font-weight:600;}
  #help p{color:var(--fg-dim); font-size:12.5px; margin:6px 0 10px; max-width:860px;}
  #help p.leg{font-size:11.5px;}
  #help table{border-collapse:collapse; font-size:12px;}
  #help td{padding:2px 14px 2px 0; color:var(--fg); vertical-align:top;}
  #help td.q{color:var(--fg-dim); font-size:11px;}
  #help kbd{font:11px var(--mono); background:var(--panel); border:1px solid var(--border); border-radius:3px; padding:0 5px; color:var(--fg);}
  #fatal{position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:var(--err); font-size:15px;
    text-align:center; padding:40px; z-index:50; background:var(--bg);}

  /* ── Gerber: o visualizador por cima da vista (hub-gerberview.js). A barra dele virou o menu
     translucido do canto (menu:true); as opcoes do pacote e os avisos do gerador moram nele,
     recolhidos (pedido do dono, 2026-10-23: "um menuzinho no canto superior esquerdo,
     transparente, com as opcoes em lista, sem muita escrita, e com icones") ── */
  #gerber{position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; background:var(--bg);}
  #gbOpcoes{display:flex; flex-direction:column; font-size:12px; color:var(--fg-dim);}
  #gbOpcoes summary{display:flex; align-items:center; gap:5px; height:26px; padding:0 8px; border-radius:5px; cursor:pointer; list-style:none; color:#c8c8ce;}
  #gbOpcoes summary::-webkit-details-marker{display:none;}
  #gbOpcoes summary:hover{background:rgba(255,255,255,.08); color:var(--fg);}
  #gbOpcoes summary svg{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  #gbOpcoes details[open] > summary{color:var(--fg);}
  .gb-gaveta{display:flex; flex-direction:column; gap:6px; padding:4px 8px 8px 29px;}
  .gb-gaveta label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .gb-gaveta select{flex:1; min-width:0; background:var(--panel2); color:var(--fg); border:1px solid var(--border); border-radius:3px; padding:2px; font-size:12px;}
  .gb-gaveta input{accent-color:var(--accent);}
  #gbMeta{color:var(--fg-dim); font-size:11px;}
  #gbAvisos > summary{color:var(--warn);}
  #gbAvisos ul{margin:2px 0 4px 0; padding:0 8px 0 29px; color:var(--fg-dim); font-size:11px; max-height:30vh; overflow:auto;}
  #gerberVista{flex:1; min-height:0; position:relative;}

  /* com o Gerber aberto, o rodape e o do visualizador (X/Y e zoom dele) */
  body.gerber-on #status{display:none !important;}
  /* lean: embutido na aba Neoden do hub -- so a placa, nunca edita */
  /* o filtro de seleção no canto do canvas: translúcido, em lista com caixas de marcar (pedido do dono, 2026-10-23) */
  #pcbfiltro{position:absolute; left:10px; top:10px; z-index:11; width:164px; padding:4px; border-radius:8px; font-size:12px;
    background:rgba(22,22,25,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#e8e8ec;
    box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 10px 28px rgba(0,0,0,.45); user-select:none;}
  #pcbfiltro .pf-cab{display:flex; align-items:center; gap:6px; height:26px; padding:0 4px 0 6px; cursor:pointer; border-radius:5px; color:#c8c8ce;}
  #pcbfiltro .pf-cab:hover{background:rgba(255,255,255,.08); color:#f2f2f3;}
  #pcbfiltro .pf-cab b{flex:1; font-weight:600; color:#f2f2f3;}
  #pcbfiltro .pf-cab span{font-size:11px; color:#a8a8ae; font-variant-numeric:tabular-nums;}
  #pcbfiltro svg{width:15px; height:15px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  #pcbfiltro .pf-lista{display:flex; flex-direction:column; margin-top:2px;}
  #pcbfiltro.pf-recolhido .pf-lista{display:none;}
  #pcbfiltro label{display:flex; align-items:center; gap:8px; height:24px; padding:0 8px; border-radius:5px; cursor:pointer; color:#c8c8ce;}
  #pcbfiltro label:hover{background:rgba(255,255,255,.08); color:#f2f2f3;}
  #pcbfiltro label.pf-todos{border-bottom:1px solid rgba(255,255,255,.08); border-radius:5px 5px 0 0; margin-bottom:2px; color:#f2f2f3;}
  #pcbfiltro input{margin:0; accent-color:var(--accent, #e8a33d); cursor:pointer;}
  body.lean #pcbfiltro{display:none !important;}
  body.lean #menubar, body.lean #pcbtb, body.lean #abas, body.lean #splitR, body.lean #props, body.lean #status, body.lean #btnPaineis{display:none !important;}
</style>
</head>
<body>
<!-- a barra de menus do Altium (File Edit View Project Place Design Tools Route Reports Window Help):
     hub-pcbaltium.js a monta das arvores do AdvPcb.rcs (hub-altiumdna.js) -->
<div id="menubar"></div>
<div id="main">
  <div id="centro">
    <div id="cvwrap">
      <canvas id="cv" tabindex="-1"></canvas>
      <!-- View » 3D Layout Mode (tecla 3): a vista WebGL por cima do canvas 2D (hub-pcb3d-vista.js) -->
      <div id="v3d" hidden></div>
      <!-- a barra de ferramentas (pcbframe.js » montaBarra): tudo a vista, o que falta travado com o porque -->
      <div id="pcbtb" role="toolbar" aria-label="Ferramentas da PCB"></div>
      <!-- o Selection Filter em lista, no canto (pcbframe.js » montaFiltroMenu) -->
      <div id="pcbfiltro" role="group" aria-label="Filtro de seleção"></div>
      <!-- o texto se digita no proprio canvas (nada de prompt) -->
      <div id="txtbox" hidden><input id="txtinp" type="text" autocomplete="off" spellcheck="false" placeholder="texto"><div id="txtdica"></div></div>
      <div id="annform" hidden>
        <div class="t">sinalizador para a IA (annotations.js)</div>
        <textarea id="anntext" rows="2" placeholder="problema (ex.: trilha muito próxima)"></textarea>
        <div class="l">
          <select id="annsev">
            <option value="err">vermelho (erro)</option>
            <option value="warn">amarelo (atenção)</option>
            <option value="info">azul (nota)</option>
          </select>
          <span style="flex:1"></span>
          <button id="annok" class="ok" type="button">OK</button>
          <button id="anncancel" type="button">Cancelar</button>
        </div>
      </div>
      <button id="btnPaineis" type="button" hidden title="Abrir o painel de propriedades"></button>
      <div id="help" hidden></div>
      <div id="fatal"></div>
    </div>
    <div id="abas"><button id="lsBtn" type="button" title="Conjuntos de camadas (LS), camada única e ver por baixo">LS</button><div id="abaslista"></div></div>
  </div>
  <div id="splitR" class="split" title="arraste para redimensionar · duplo clique fecha/abre"></div>
  <aside id="props"></aside>
  <div id="gerber" hidden>
    <div id="gbOpcoes">
      <details id="gbAvisos" hidden></details>
      <details id="gbOpc"><summary id="gbOpcSum" title="Nomes dos arquivos, camadas vazias, legenda e atributos X2 do pacote">Opções</summary>
        <div class="gb-gaveta">
          <span id="gbMeta"></span>
          <label title="Como os arquivos se chamam no pacote: em minúsculas, como vai para a JLCPCB, ou como o Project Outputs do Altium">Nomes
            <select id="gbNomes">
              <option value="fabricacao">Fabricação</option>
              <option value="altium">Altium</option>
            </select></label>
          <label title="Camada sem objeto sai do pacote (padrão), como no pacote da casa"><input type="checkbox" id="gbVazias"> Camadas vazias</label>
          <label title="Legenda com extensão .gto/.gbo (172 de 282 pacotes da casa renomeiam)"><input type="checkbox" id="gbGto"> Legenda .gto/.gbo</label>
          <label title="Atributos X2 (TF/TA e o MD5), como o Altium 21; desligado, como o CAMtastic reexporta"><input type="checkbox" id="gbX2"> Atributos X2</label>
        </div>
      </details>
    </div>
    <div id="gerberVista"></div>
  </div>
</div>
<div id="status">
  <span id="sxy">—</span>
  <span id="sgrade"></span>
  <span id="scam"><i id="scamsw"></i><b id="scamn"></b></span>
  <span id="srota"></span>
  <span id="shover"></span>
  <span id="ssel"></span>
  <span id="smsg"></span>
</div>
<div id="menu" hidden></div>

<script>
  /* os dados do projeto: o espelho (board.js), as mudancas (changes.js) e os sinalizadores */
  (function () {
    var p = new URLSearchParams(location.search).get('p');
    var base = p ? 'Projects/' + encodeURIComponent(p) + '/' : '';
    ['board.js', 'changes.js', 'annotations.js', 'rules.js'].forEach(function (f) {
      document.write('<script src="' + base + f + '"><\/script>');
    });
  })();
</script>
<script src="hub-core.js"></script>
<script src="hub-font.js"></script>
<!-- a regra de o que e furo da placa (HubLaser.boardCutouts) e o encadeamento do contorno:
     a tela, o laser e o Gerber concordam -->
<script src="hub-laser.js"></script>
<script src="hub-io.js"></script>
<!-- modal e notificacao no tema da pagina: nada de alert()/confirm() do navegador -->
<script src="hub-dialog.js"></script>
<script src="hub-autosave.js"></script>
<script src="hub-semhub.js" defer></script>
<!-- a tabela de teclas (HubAtalhos.pcb) e o editor dela nas Configuracoes do hub -->
<script src="hub-atalhos.js"></script>
<!-- o traçado com cantos 45/90/livre, o mesmo do fio do Esquema -->
<script src="hub-fio.js"></script>
<!-- o roteador: trilha de outra net nao se encontra -- a Trilha contorna o obstaculo (Walkaround do
     Altium) e a edicao que faria nets diferentes se encontrarem e recusada. Sem ele a vista abre
     igual, so sem conferir (pcbframe.js » motorLigado) -->
<script src="hub-roteador.js"></script>
<!-- o auto-roteador em lote (Route » Auto Route » All, U,A,A): o motor, o worker (que também serve de
     fallback em fatias na página) e a conversa com a pessoa (pedido, progresso, prévia). Sem eles a
     vista abre igual, só sem o Auto-rotear -->
<script src="hub-autoroteador.js"></script>
<script src="hub-autoroteador-worker.js"></script>
<script src="hub-pcbautorota.js"></script>
<!-- as guias do arrasto (as do Esquema): borda, centro, centro de pad, espaço igual e o vão até o vizinho;
     o editor de footprint usa as mesmas. Sem elas o arrasto é o de sempre -->
<script src="hub-guias.js"></script>
<!-- o que veio do Altium, cada um no seu modulo (sem ele a vista abre igual, so sem o recurso):
     conectividade/ratsnest/realce de net e os teardrops -->
<script src="hub-pcbnets.js"></script>
<script src="hub-pcbteardrop.js"></script>
<!-- polygon pour (o Clipper de Angus Johnson, licenca Boost, e o motor de despejo) e a placa nova + ECO -->
<script src="hub-clipper.js"></script>
<script src="hub-pcbpour.js"></script>
<script src="hub-pcbeco.js"></script>
<script src="hub-pcbnova.js"></script>
<script src="hub-pcbeco-ui.js"></script>
<!-- Gerber: o gerador (depois do hub-font e do hub-laser, que ele usa) e o visualizador -->
<script src="hub-gerber.js"></script>
<script src="hub-gerberview.js"></script>
<!-- PDF de layout (o "LO -" do Draftsman da casa): o escritor, o carimbo DIEletrons, o gerador e o dialogo -->
<!-- regras de projeto e DRC (Design » Rules e Tools » Design Rule Check) -->
