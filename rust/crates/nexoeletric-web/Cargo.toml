[package]
name = "nexoeletric-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NexoEletric: a interface web de sempre numa casca Rust (WebView2), com o servidor e a vista PCB em Rust"

[[bin]]
name = "NexoEletric"
path = "src/main.rs"

[dependencies]
nexo-hub = { path = "../nexo-hub" }
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3"
