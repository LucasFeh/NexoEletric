# AltiumPCBMirror — o hub no servidor ODOO (192.168.15.192).
#
# Vive em /srv/altiumhub/compose.yml. Sobe com:
#     cd /srv/altiumhub && docker compose up -d
#
# O Samba NAO esta aqui de proposito: a maquina ja roda um (as portas 445 e 139
# estao ocupadas por ele, e ela e o master browser do workgroup, com o share
# Compartilhado publicado). O share do hub entra no smb.conf que ja existe --
# veja smb-altiumhub.conf ao lado deste arquivo.

name: altiumhub

services:
  hub:
    # SEM secao `build:` de proposito. Quem constroi a imagem e o deploy.sh, com
    # `docker build` e a RELEASE como contexto. Duas razoes:
    #  - no primeiro deploy o symlink `current` ainda nao existe, entao um
    #    `context: ./current` aponta para o vazio bem na hora em que a imagem
    #    precisa nascer;
    #  - sem `build:`, o compose nunca tenta puxar altiumhub:local de um registry
    #    e nunca imprime o "pull access denied ... may require docker login", que
    #    parece falha e nao e.
    image: altiumhub:local
    container_name: altiumhub
    pull_policy: never

    # Rede do host, e nao bridge. Dois motivos medidos:
    #   - o link do BOM (hubserver.py:888-908) e o banner de arranque montam a
    #     URL a partir do IP real da interface (_lan_ip, hubserver.py:917); na
    #     bridge sai o IP interno do container, que ninguem alcanca.
    #   - o Odoo esta em 127.0.0.1:8070 do HOST. Com bridge, 127.0.0.1 dentro do
    #     container e o proprio container, e o sincronismo nao acha o ERP.
    #
    # O que host mode NAO conserta: _is_local (hubserver.py:237-241) compara o IP
    # do CLIENTE com os IPs da maquina. Num servidor headless o usuario esta
    # sempre remoto, em qualquer modo de rede, entao o formulario de credencial
    # do Odoo nunca aparece no navegador de ninguem. Por isso o INSTALL manda
    # escrever shared/hub-almox.json a mao, com os QUATRO campos: a variavel
    # ODOO_SENHA cobre so a senha (odoo_pull.py:60-61), e url/db/login cairiam no
    # PADRAO de odoo_pull.py:34, que e o Odoo de TESTE.
    network_mode: host

    volumes:
      # /srv/altiumhub inteiro, no MESMO caminho absoluto de dentro e de fora.
      # E o que faz os dois niveis de symlink resolverem igual nos dois lados:
      # current -> releases/<hash>, e dentro da release Projects/ e os arquivos
      # de estado de Libs/ -> shared/. Montar so a release deixaria os symlinks
      # apontando para um caminho que nao existe dentro do container.
      - /srv/altiumhub:/srv/altiumhub

    working_dir: /srv/altiumhub/current
    command: ["python", "hubserver.py", "--port", "8100"]

    environment:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8

      # O CLAUDE DO CHAT MORA EM shared/, E NAO DENTRO DO CONTAINER.
      #
      # Medido em 2026-09-16, depois de o usuario perder o dele: o deploy RECRIA o container
      # (docker compose up -d apos trocar o `current`), entao tudo que for instalado la dentro
      # a mao -- binario e login -- desaparece no deploy seguinte. Foi exatamente o que
      # aconteceu: "eu tinha resolvido esse problema com o claude de la mas dps do seu deploy
      # parou de funcionar".
      #
      # O HOME aponta para dentro do bind mount /srv/altiumhub (mesmo caminho absoluto dos dois
      # lados), que e o unico pedaco de disco que atravessa o deploy.
      #
      # O QUE O DEPLOY DESTRUIA ERA O BINARIO, e nao o login -- medido depois, e vale corrigir
      # aqui porque a primeira explicacao estava errada. O login do servidor e um
      # CLAUDE_CODE_OAUTH_TOKEN que mora no /etc/altiumhub/senha.env, do HOST: ele nunca se
      # perdeu, e por isso o chat voltou a funcionar assim que o binario foi reinstalado, sem
      # refazer `claude setup-token`.
      #
      # O HOME importa porque e onde o INSTALADOR poe as coisas: ~/.local/bin/claude e um
      # atalho para ~/.local/share/claude/versions/<v>, 219 MB no total. Com o HOME aqui, esses
      # 219 MB caem dentro do bind mount e atravessam a publicacao.
      #
      # De quebra, ele cobre tambem quem autenticar pelo `claude` interativo em vez do token:
      # a credencial desse caminho e um arquivo (~/.claude/.credentials.json), e arquivo dentro
      # do container morre no deploy do mesmo jeito que o binario morreu.
      #
      # A instalacao e de UMA vez, no servidor (ver README, secao do chat):
      #   docker compose -f /srv/altiumhub/compose.yml exec hub       #     sh -lc 'curl -fsSL https://claude.ai/install.sh | bash'
      #   docker compose -f /srv/altiumhub/compose.yml exec -it hub claude   # e entrar na conta
      #
      # ALTIUMHUB_CLAUDE e explicito porque o PATH do container e curto
      # (/usr/local/bin:/usr/bin:/bin) e nao inclui ~/.local/bin. Nao e segredo: caminho de
      # arquivo nao vai para o senha.env, que e para o que nao pode ser lido.
      HOME: /srv/altiumhub/shared/claude-home
      ALTIUMHUB_CLAUDE: /srv/altiumhub/shared/claude-home/.local/bin/claude
    # A senha mestre nunca entra em arquivo versionado. Crie no host:
    #   printf 'ALTIUMHUB_MASTER=%s\n' "$(openssl rand -base64 24)" \
    #     | sudo tee /etc/altiumhub/senha.env
    #   sudo chmod 600 /etc/altiumhub/senha.env
    env_file:
      - /etc/altiumhub/senha.env

    restart: unless-stopped

    # /__live.js (hubserver.py:94) devolve uma constante e nao toca disco. E o
    # que se quer num teste que roda a cada 30 s. O /api/index.json, que o
    # deploy.sh usa uma vez por deploy, le TODOS os board.js -- bom como prova
    # de que o hub funciona, caro como batimento cardiaco.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://127.0.0.1:8100/__live.js"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    # Divide maquina com o ERP da empresa. Peso de CPU abaixo do padrao 1024, e
    # teto de memoria para um vazamento no hub nunca chegar no Odoo.
    cpu_shares: 256
    mem_limit: 1g
    pids_limit: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
