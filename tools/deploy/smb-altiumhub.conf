# Share do AltiumPCBMirror, para o Altium de qualquer máquina alcançar as libs,
# os projetos e os .pas que hoje vivem no D: do LUCAS-PC.
#
# O servidor 192.168.15.192 JÁ roda Samba: ele se chama ODOO, é o master browser
# do workgroup e publica o share `Compartilhado`. Então isto NÃO é um servidor
# novo, é uma seção nova no smb.conf que já existe.
#
# Instalar:
#     sudo cp smb-altiumhub.conf /etc/samba/smb.conf.d/altiumhub.conf
#     # se o smb.conf não tiver "include", cole a seção no fim dele
#     sudo testparm -s          # tem que passar sem erro
#     sudo systemctl reload smbd
#
# Do Windows:
#     net use P: \\192.168.15.192\altiumhub /persistent:yes

[altiumhub]
   comment = AltiumPCBMirror - libs, projetos e scripts do Altium
   path = /srv/altiumhub

   browseable = yes
   read only = no
   guest ok = yes

   # Tudo que chega pelo Windows vira do mesmo dono que o container usa (UID
   # 1500 no Dockerfile). Sem isto, o Altium grava board.js como outro usuário e
   # o hub não consegue reescrever o arquivo — ou o contrário, e a falha aparece
   # como "acesso negado" no meio de um ApplyChanges.
   force user = altiumhub
   force group = altiumhub
   create mask = 0664
   directory mask = 0775

   # O share aponta para /srv/altiumhub, e não para current/, de propósito:
   # `current` é symlink para releases/<hash>, e dentro da release Projects/ e os
   # arquivos de estado de Libs/ são symlinks para shared/. Com a raiz do share
   # em /srv/altiumhub todos esses alvos ficam DENTRO do share, e o Samba os
   # segue sem precisar de `wide links`, que é justamente a opção que abre a
   # máquina inteira para quem monta.
   follow symlinks = yes
   wide links = no

   # O container escreve nos mesmos arquivos que o Windows lê. Com oplocks o
   # cliente cacheia e passa a ver conteúdo velho depois de um sincronismo do
   # almoxarifado. Os .SchLib do almoxarifado têm dezenas de KB, então desligar
   # custa pouco e evita o Altium abrir uma biblioteca desatualizada.
   oplocks = no
   level2 oplocks = no

   # Nomes de pasta do projeto têm acento e espaço, por exemplo
   # "PRJ - IT - DI221705 (Alimentação)".
   unix charset = UTF-8

   # Nada aqui é para o Windows enxergar.
   veto files = /.git/.gitignore/.gitattributes/.dockerignore/
   delete veto files = no
